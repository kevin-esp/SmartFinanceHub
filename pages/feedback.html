<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | SmartFinanceHub</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header>
    <h1>SmartFinanceHub</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="proposal.html">Proposal</a>
        <a href="feedback.html">Feedback</a>
    </nav>
</header>

<main>

<h2>Website Feedback</h2>

<p>
Help us improve SmartFinanceHub by answering a few quick questions.
</p>

<form>

<label for="name">Name</label><br>
<input type="text" id="name" name="name"><br><br>

<label for="email">Email</label><br>
<input type="email" id="email" name="email"><br><br>

<label>How easy was the website to navigate?</label><br>

<input type="radio" name="navigation" value="1"> 1
<input type="radio" name="navigation" value="2"> 2
<input type="radio" name="navigation" value="3"> 3
<input type="radio" name="navigation" value="4"> 4
<input type="radio" name="navigation" value="5"> 5

<br><br>

<label>Which topics were most useful?</label><br>

<input type="checkbox" name="topics" value="Budgeting"> Budgeting<br>

<input type="checkbox" name="topics" value="Credit"> Credit<br>

<input type="checkbox" name="topics" value="Loans"> Loans<br>

<input type="checkbox" name="topics" value="Investing"> Investing<br>

<input type="checkbox" name="topics" value="Saving"> Saving Money

<br><br>

<label for="visit">How likely are you to visit SmartFinanceHub again?</label><br>

<select id="visit" name="visit">
    <option>Very Likely</option>
    <option>Likely</option>
    <option>Maybe</option>
    <option>Unlikely</option>
</select>

<br><br>

<label for="comments">What could we improve?</label><br>

<textarea id="comments"
rows="6"
cols="50"
placeholder="Share your thoughts here..."></textarea>

<br><br>

<input type="submit" value="Submit Feedback">

<input type="reset" value="Clear Form">

</form>

</main>

<footer>

<p>&copy; 2026 SmartFinanceHub</p>

</footer>

</body>
</html>
